<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fake Sort v1 — Visualizer</title><style>body{font:16px system-ui;background:#101722;color:#e5edf8;max-width:850px;margin:auto;padding:18px}section{background:#1c2838;padding:16px;border-radius:12px;margin:12px 0}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #52647a;background:#26384c;color:white;max-width:100%;box-sizing:border-box}label{display:block;margin:10px 0}button{background:#245c9b;margin:5px 4px 5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b5c5d9}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 3px;border-bottom:1px solid #52647a;text-align:right}td:first-child,th:first-child{text-align:left}</style><h1>Fake Sort v1</h1><button id="lang">한국어</button><section><h2 id="heading"></h2><label><span id="sl"></span> <input id="seed" type="number" value="12345"></label><label><span id="ml"></span> <select id="mode"><option>original</option><option>pure</option><option>advanced</option><option selected>optimized</option></select></label><label><span id="nl"></span> <input id="n" type="number" min="2" max="160" value="32"></label><label><span id="kl"></span> <select id="kind"></select></label><label><span id="pl"></span> <select id="pace"><option value="serial"></option><option value="inter"></option><option value="pass"></option></select></label><label><span id="vl"></span> <input id="speed" type="range" min="0" max="100" value="45"></label><label><input id="hide" type="checkbox"> <span id="hl"></span></label><button id="reset"></button><button id="play"></button><button id="step"></button><p id="legend"></p><p id="info" aria-live="polite"></p><h3>A</h3><canvas id="a" style="width:100%;height:140px;background:#101722"></canvas><div id="bwrap"><h3>B</h3><canvas id="b" style="width:100%;height:140px;background:#101722"></canvas></div><p id="stats"></p><small id="note"></small></section><script>
// Fake Sort: finite numeric arrays; modifies and returns input.
const networks = {"2": [[1, 0]], "3": [[1, 0], [2, 1], [1, 0]], "4": [[1, 0], [3, 2], [2, 0], [3, 1], [2, 1]], "5": [[3, 0], [4, 1], [2, 0], [3, 1], [1, 0], [4, 2], [2, 1], [4, 3], [3, 2]], "6": [[5, 0], [3, 1], [4, 2], [2, 1], [4, 3], [3, 0], [5, 2], [1, 0], [3, 2], [5, 4], [2, 1], [4, 3]], "7": [[6, 0], [3, 2], [5, 4], [2, 0], [4, 1], [6, 3], [1, 0], [5, 2], [4, 3], [2, 1], [6, 4], [3, 2], [5, 4], [2, 1], [4, 3], [6, 5]], "8": [[2, 0], [3, 1], [6, 4], [7, 5], [4, 0], [5, 1], [6, 2], [7, 3], [1, 0], [3, 2], [5, 4], [7, 6], [4, 2], [5, 3], [4, 1], [6, 3], [2, 1], [4, 3], [6, 5]]};
function fakeSort(a,{mode="optimized",scratch=null}={}){
 if(!["original","pure","advanced","optimized"].includes(mode))throw Error("unknown mode");
 if(!Array.isArray(a)&&!(a instanceof Float64Array))throw Error("Array or Float64Array required");
 for(const v of a)if(!Number.isFinite(v))throw Error("finite numbers only");
 const n=a.length;if(n<2)return a;
 const original=mode==="original", c8=mode==="advanced"||mode==="optimized";
 const b=scratch??new Array(n);if((!Array.isArray(b)&&!(b instanceof Float64Array))||b===a||b.length<n|| (ArrayBuffer.isView(a)&&ArrayBuffer.isView(b)&&a.buffer===b.buffer))throw Error("invalid scratch");
 function small(src,l,k){const v=Array.from({length:k},(_,i)=>src[l+i]);for(const [i,j] of networks[k])if(v[i]<v[j])[v[i],v[j]]=[v[j],v[i]];for(let i=0;i<k;i++)a[l+i]=v[i];}
 if(c8&&n<=8){small(a,0,n);return a;}
 let rooms=[[0,n-1,false,false]],next=[];
 while(rooms.length){next.length=0;for(const [l,r,flag,parity] of rooms){
 const src=parity?b:a,dst=parity?a:b,pi=l+Math.floor((r-l)/(flag?4:2)),p=src[pi];let w=l,z=r;
 function low(i){const v=src[i];if(v<p)dst[w++]=v;else if(v>p)dst[z--]=v;}
 if(original){for(let i=l;i<=r;i++)low(i);}else{for(let i=l;i<=pi;i++)low(i);for(let i=r;i>pi;i--){const v=src[i];if(v>p)dst[z--]=v;else if(v<p)dst[w++]=v;}}
 if(original||parity||w!==l||z!==r)for(let i=w;i<=z;i++)a[i]=p;
 function child(x,y){const k=y-x+1;if(k<1)return;if(k===1){if(!parity)a[x]=dst[x];return;}if(c8&&k<=8){small(dst,x,k);return;}next.push([x,y,!original&&8*k>7*(r-l+1),!parity]);}
 child(l,w-1);child(z+1,r);
 }if(mode==="optimized"){[rooms,next]=[next,rooms];}else{rooms=next;next=[];}}return a;
}
if(typeof module!=="undefined")module.exports={fakeSort};

function rng(seed){let x=seed>>>0;return ()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296}}
function make(n,k,seed){if(k==='killer'){let ids=Array.from({length:n},(_,i)=>i),a=new Array(n),flag=false;for(let v=0;ids.length;v++){let size=ids.length,p=Math.floor((size-1)/(flag?4:2));a[ids[p]]=v;ids.splice(p,1);ids.reverse();flag=8*(size-1)>7*size;}return a;}let r=rng(seed),a=Array.from({length:n},(_,i)=>{switch(k){case'random':return Math.floor(r()*n*4);case'asc':case'near':return i;case'desc':return n-i;case'equal':return 7;case'dup':return Math.floor(r()*32);case'mount':return Math.min(i,n-1-i);case'saw':return i%97;case'organ':return Math.abs(i-Math.floor(n/2));}});if(k==='near')for(let i=0;i<Math.max(1,n/100);i++){let x=Math.floor(r()*n),y=Math.floor(r()*n);[a[x],a[y]]=[a[y],a[x]]}return a}
function directTrace(s,src,l,r){let x=[];for(let i=l;i<=r;i++)x.push(src[i]);s.reads+=x.length;for(const [i,j] of networks[x.length]){s.cmp++;if(x[i]<x[j])[x[i],x[j]]=[x[j],x[i]];}for(let i=l;i<=r;i++){s.a[i]=x[i-l];s.fixed[i]=true;s.writes++;}s.direct=(s.direct||0)+1;}
function* roomTrace(s,t,src,dst,next){let [l,r,flag]=t.room,pi=l+Math.floor((r-l)/(flag?4:2)),p=src[pi],w=l,z=r;t.pi=pi;s.reads++;s.parts++;if(flag)s.adapt++;yield;for(let k=l;k<=r;k++){let high=s.variant!=='original'&&k>pi,i=high?r-(k-pi-1):k;let v=src[i];t.read=i;t.write=-1;s.reads++;s.cmp++;if(high){if(v>p){t.write=z;dst[z--]=v;s.writes++;}else{s.cmp++;if(v<p){t.write=w;dst[w++]=v;s.writes++;}}}else if(v<p){t.write=w;dst[w++]=v;s.writes++;}else{s.cmp++;if(v>p){t.write=z;dst[z--]=v;s.writes++;}}t.writeBuffer=dst;yield;}t.read=-1;t.pi=-1;t.writeBuffer=s.a;let skip=s.variant!=='original'&&src===s.a&&w===l&&z===r;for(let i=w;i<=z;i++){s.fixed[i]=true;if(!skip){s.a[i]=p;t.write=i;s.writes++;yield;}}for(const [lo,hi] of [[l,w-1],[z+1,r]]){if(['advanced','optimized'].includes(s.variant)&&hi>lo&&hi-lo<8){directTrace(s,dst,lo,hi);t.write=lo;yield;}else if(hi>lo)next.push([lo,hi,s.variant!=='original'&&8*(hi-lo+1)>7*(r-l+1)?1:0]);else if(hi===lo){if(dst!==s.a){s.a[lo]=dst[lo];s.reads++;s.writes++;}s.fixed[lo]=true;t.write=lo;yield;}}}
function* trace(s){if(['advanced','optimized'].includes(s.variant)&&s.a.length<=8){directTrace(s,s.a,0,s.a.length-1);s.done=true;s.rooms=[];s.msg=same(s.a,s.ref)?'done':'error';yield;return;}let src=s.a,dst=s.b,rooms=[[0,src.length-1,0]];while(rooms.length){s.depth++;s.rooms=rooms;s.peak=Math.max(s.peak,rooms.length);s.source=src===s.a?'A':'B';let next=s.variant==='optimized'?(s.next||[]):[];next.length=0;let tasks=rooms.map(room=>{let t={room,pi:-1,read:-1,write:-1,done:false};t.it=roomTrace(s,t,src,dst,next);return t});let mode=s.mode;while(tasks.some(t=>!t.done)){let live=tasks.filter(t=>!t.done);if(mode==='serial')live=live.slice(0,1);for(const t of live)t.done=t.it.next().done;s.marks=live.filter(t=>!t.done);s.msg='active';if(mode!=='pass')yield;}if(mode!=='serial')next.sort((a,b)=>a[0]-b[0]);if(s.variant==='optimized')s.next=rooms;rooms=next;[src,dst]=[dst,src];s.source=src===s.a?'A':'B';s.rooms=rooms;s.marks=[];s.msg='swap';if(!rooms.length){s.done=true;s.msg=same(s.a,s.ref)?'done':'error';}yield;}}
const $=id=>document.getElementById(id),same=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);let ko=false,s,it,timer=null;const types={random:['Random','무작위'],asc:['Ascending','오름차순'],desc:['Descending','내림차순'],near:['Nearly sorted','거의 정렬'],equal:['All equal','모두 동일'],dup:['32 distinct values','중복 32종'],mount:['Mountain','산 형태'],saw:['Sawtooth','톱니 형태'],organ:['Valley','골짜기 형태'],killer:['Pivot bias candidate','피벗 편향 후보']};
function tr(a,b){return ko?b:a}function text(id,a,b){$(id).textContent=tr(a,b)}
function labels(){document.documentElement.lang=ko?'ko':'en';text('lang','한국어','English');text('heading','Algorithm visualization','알고리즘 시각화');text('sl','Seed','시드');text('ml','Mode','모드');text('nl','Elements (2–160)','원소 수 (2–160)');text('kl','Input type','입력 유형');text('pl','Playback','재생 방식');text('vl','Speed','속도');text('hl','Hide buffer B','B 버퍼 숨기기');text('reset','New array','새 배열');text('play',timer?'Pause':'Play',timer?'일시정지':'재생');text('step','Step','한 단계');text('legend','Green: final A · Yellow: read · Orange: pivot · Blue: write · Purple: adaptive room · Gray: other data','초록: A 확정 · 노랑: 읽기 · 주황: 피벗 · 파랑: 기록 · 보라: 적응 방 · 회색: 기타 데이터');text('note','Logical element counters, not hardware counters or benchmarks. Interleaved playback is not CPU parallelism. Small networks are shown as one action. Advanced and Optimized move elements identically; Optimized reuses room lists.','논리 원소 연산 횟수이며 하드웨어 계측이나 벤치마크가 아닙니다. 교차 재생은 CPU 병렬 처리가 아닙니다. 작은 정렬 네트워크는 한 동작으로 표시합니다. Advanced와 Optimized의 원소 이동은 같으며 Optimized는 방 목록을 재사용합니다.');for(const o of $('kind').options)o.textContent=types[o.value][ko?1:0];['Serial','Interleaved','Whole wave'].forEach((v,i)=>$('pace').options[i].textContent=ko?['순차','교차','파동 전체'][i]:v);draw()}
function draw(){if(!s)return;for(const key of ['a','b']){if(key==='b'&&$('hide').checked)continue;const c=$(key),w=c.clientWidth||300,h=140,d=Math.min(2,window.devicePixelRatio||1);c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);const arr=s[key],dx=w/arr.length;for(let i=0;i<arr.length;i++){if(arr[i]===undefined)continue;g.fillStyle=key==='a'&&s.fixed[i]?'#38c98b':'#a7b9d0';if(s.source===key.toUpperCase()&&s.marks.some(t=>t.pi===i))g.fillStyle='#ff9c45';if(s.source===key.toUpperCase()&&s.marks.some(t=>t.read===i))g.fillStyle='#f8dc62';if(s.marks.some(t=>t.writeBuffer===arr&&t.write===i))g.fillStyle='#56a8ff';const ht=8+(h-18)*(arr[i]-s.min)/Math.max(1,s.max-s.min);g.fillRect(i*dx,h-ht,Math.max(1,dx-1),ht)}if(s.source===key.toUpperCase())for(const [l,r,f] of s.rooms){g.strokeStyle=f?'#c084fc':'#52647a';g.strokeRect(l*dx,1,(r-l+1)*dx-1,h-2)}}$('bwrap').hidden=$('hide').checked;const messages={ready:['Ready','준비'],active:['Processing rooms','방 처리 중'],swap:['Buffers exchanged','버퍼 교대'],done:['Sorted · PASS','정렬 완료 · PASS'],error:['Correctness error','정확성 오류']};$('info').textContent=messages[s.msg][ko?1:0]+' · '+tr('Wave ','파동 ')+s.depth+' · '+tr('Rooms ','방 ')+s.rooms.length+' · '+tr('Source ','원본 ')+s.source;$('stats').textContent=[['Reads','읽기',s.reads],['Writes','기록',s.writes],['Comparisons','비교',s.cmp],['Partitions','분할',s.parts],['Adaptive','적응',s.adapt],['Networks','네트워크',s.direct||0],['Peak rooms','최대 방',s.peak]].map(([a,b,v])=>tr(a,b)+' '+v).join(' · ')}
function stop(){clearTimeout(timer);timer=null}function reset(){stop();const n=Math.max(2,Math.min(160,Math.floor(Number($('n').value)||32)));$('n').value=n;const a=make(n,$('kind').value,Number($('seed').value));s={a,b:new Array(n),ref:fakeSort(a.slice(),{mode:$('mode').value}),fixed:new Array(n).fill(false),variant:$('mode').value,mode:$('pace').value,reads:0,writes:0,cmp:0,parts:0,adapt:0,depth:0,peak:0,rooms:[[0,n-1,0]],marks:[],source:'A',msg:'ready',min:Math.min(...a),max:Math.max(...a)};it=trace(s);labels()}function step(){if(!s.done)it.next();draw();if(s.done){stop();labels()}}function tick(){step();if(!s.done)timer=setTimeout(tick,Math.max(8,500-4.9*Number($('speed').value)))}for(const k of Object.keys(types))$('kind').add(new Option(types[k][0],k));$('lang').onclick=()=>{ko=!ko;labels()};$('reset').onclick=reset;$('step').onclick=()=>{stop();step();labels()};$('play').onclick=()=>{if(timer)stop();else if(!s.done)timer=setTimeout(tick,0);labels()};for(const id of ['mode','pace','kind','n','seed'])$(id).onchange=reset;$('hide').onchange=draw;reset();</script></html>
